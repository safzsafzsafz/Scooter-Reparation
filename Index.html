<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vespa Fix-Up Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--olive:#738849;--oliveD:#5c6e38;--cream:#f4ecd9;--ink:#3a2a22;--pink:#cf9fba;--pinkL:#ecd0dc;--gold:#d9b24c;--navy:#22305a;--denim:#b9cbdc;--tan:#c9a27a;--sage:#a8b98a;--bad:#c9574a;--good:#6f8a3c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Patrick Hand','Comic Sans MS',cursive;color:var(--ink);background:var(--olive);
 background-image:radial-gradient(ellipse at 20% 15%,rgba(255,255,230,.18),transparent 45%),radial-gradient(ellipse at 85% 80%,rgba(40,50,20,.28),transparent 50%),radial-gradient(ellipse at 70% 20%,rgba(30,40,10,.18),transparent 40%),radial-gradient(ellipse at 10% 90%,rgba(255,255,220,.12),transparent 40%);
 background-attachment:fixed;min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.55;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .2  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1,h2,h3,.hand{font-family:'Gaegu','Patrick Hand',cursive;font-weight:700;margin:0}
#app{max-width:1240px;margin:0 auto;padding:12px 14px 28px}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.brand{font-family:Gaegu;font-weight:700;font-size:28px;color:var(--cream);text-shadow:2px 2px 0 var(--ink);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border:2.5px solid var(--ink);border-radius:30px 12px 28px 14px/14px 28px 12px 30px;padding:3px 14px;font-size:20px;box-shadow:2px 3px 0 rgba(58,42,34,.45)}
.card{background:var(--cream);border:2.5px solid var(--ink);border-radius:20px 7px 22px 9px/9px 22px 7px 20px;box-shadow:4px 5px 0 rgba(58,42,34,.38)}
.btn{font-family:Gaegu,cursive;font-weight:700;font-size:22px;line-height:1.1;color:var(--ink);background:var(--pinkL);border:2.5px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:7px 20px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{background:#f4dbe5;transform:translate(-1px,-1px) rotate(-.6deg)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.gold{background:#f0d58a}.btn.gold:hover{background:#f6e2a8}
.btn.sage{background:#c8d4ad}.btn.sage:hover{background:#d6e0bf}
.btn.cream{background:var(--cream)}
.btn.sm{font-size:17px;padding:4px 12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:40px;height:40px;padding:0;display:inline-grid;place-items:center;font-size:20px}
.screen{display:none}.screen.on{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- MENU ---------- */
.hero{position:relative;overflow:hidden;padding:0;aspect-ratio:16/9;max-height:72vh;width:100%}
.hero svg{width:100%;height:100%;display:block}
.hero .menuBtns{position:absolute;right:5%;bottom:9%;display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:210px}
.hero .menuBtns .btn{font-size:26px}
.title-wrap{position:absolute;left:4%;top:6%;max-width:58%}
.title-wrap h1{font-size:clamp(34px,6vw,74px);line-height:.9;color:var(--cream);text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.title-wrap p{font-size:clamp(16px,2vw,22px);color:var(--cream);margin:.5em 0 0;text-shadow:1px 1px 0 var(--ink)}

.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
.sectionHead h2{font-size:38px;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}

/* ---------- LEVELS ---------- */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.lvl{padding:14px 14px 16px;position:relative;cursor:pointer;transition:transform .15s}
.lvl:nth-child(odd){transform:rotate(-.8deg)}.lvl:nth-child(even){transform:rotate(.7deg)}
.lvl:hover{transform:rotate(0) translateY(-4px)}
.lvl .num{position:absolute;top:-14px;left:-10px;width:44px;height:44px;border-radius:50%;background:var(--gold);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:Gaegu;font-weight:700;font-size:24px}
.lvl svg.ic{width:100%;height:120px;display:block}
.lvl h3{font-size:26px;margin-top:4px}
.lvl p{margin:2px 0 8px;font-size:17px;opacity:.8}
.lvl .stars{font-size:28px;letter-spacing:2px}
.lvl.locked{filter:grayscale(.7) brightness(.9);cursor:not-allowed}
.lvl.locked::after{content:"🔒 Finish the previous repair";position:absolute;inset:0;display:grid;place-items:center;background:rgba(58,42,34,.35);color:var(--cream);font-family:Gaegu;font-size:22px;font-weight:700;border-radius:inherit;text-shadow:1px 1px 0 var(--ink)}
.star{color:#cbbf9f;-webkit-text-stroke:1.5px var(--ink)}.star.on{color:var(--gold)}

/* ---------- PLAY ---------- */
.playwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
@media (max-width:900px){.playwrap{grid-template-columns:1fr}}
#stage{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;touch-action:none;container-type:inline-size;border-radius:18px 8px 20px 10px/10px 20px 8px 18px;border:3px solid var(--ink);box-shadow:5px 6px 0 rgba(58,42,34,.45);background:#7d9152}
#stage>svg,#stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#over{pointer-events:none}
#cv{display:none;cursor:crosshair}
#stage.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#tray{position:absolute;left:0;right:0;bottom:1.2cqw;display:flex;justify-content:center;gap:1.2cqw;pointer-events:none}
.tool{pointer-events:auto;width:9.4cqw;background:var(--cream);border:2.5px solid var(--ink);border-radius:14px 6px 16px 7px/7px 16px 6px 14px;box-shadow:2px 3px 0 rgba(58,42,34,.5);cursor:pointer;padding:.3cqw .3cqw .2cqw;text-align:center;transition:transform .12s;font-family:'Patrick Hand';font-size:max(10px,1.25cqw);line-height:1.05;color:var(--ink)}
.tool svg{width:5.4cqw;height:5.4cqw;display:block;margin:0 auto}
.tool:hover{transform:translateY(-4px) rotate(-2deg)}
.tool.sel{background:#f0d58a;transform:translateY(-6px)}
.tool.wrong{background:#eab3a8;animation:shake .3s}
.tool.hintme{animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#actions{position:absolute;left:0;right:0;bottom:13.5cqw;display:flex;justify-content:center;gap:1.2cqw;flex-wrap:wrap;pointer-events:none;padding:0 2cqw}
#actions .btn{pointer-events:auto;font-size:max(14px,2cqw);padding:.6cqw 1.8cqw}
#actions .btn.hold.on{background:#f0d58a;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#toasts{position:absolute;top:2cqw;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5cqw;pointer-events:none;z-index:5}
.toast{font-family:Gaegu;font-weight:700;font-size:max(14px,2.1cqw);background:var(--cream);border:2.5px solid var(--ink);border-radius:20px 8px 22px 9px/9px 22px 8px 20px;padding:.4cqw 1.6cqw;box-shadow:2px 3px 0 rgba(58,42,34,.5);animation:toast 2.3s forwards;white-space:nowrap}
.toast.bad{background:#efc2b6}.toast.good{background:#d6e2b6}.toast.meh{background:#f3e2a9}
@keyframes toast{0%{opacity:0;transform:translateY(-10px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#modal{position:absolute;inset:0;background:rgba(40,30,22,.45);display:grid;place-items:center;z-index:10}
#modal[hidden]{display:none}
#modal .card{width:min(86%,640px);padding:2cqw 2.6cqw;display:grid;grid-template-columns:22% 1fr;gap:2cqw;align-items:center}
#modal h3{font-size:max(20px,3cqw)}
#modal .txt{font-size:max(15px,2cqw);min-height:6em}
#modal .dots{display:flex;gap:6px;margin:.6em 0}
#modal .dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);display:block}
#modal .dots i.on{background:var(--pink)}
#side{padding:12px 14px}
#side .lvTitle{font-size:28px;line-height:1}
#side .stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#side .stats .pill{font-size:18px;padding:2px 10px}
#tasks{list-style:none;padding:0;margin:8px 0 10px;font-size:18px}
#tasks li{padding:3px 0 3px 30px;position:relative;opacity:.55}
#tasks li::before{content:"";position:absolute;left:2px;top:6px;width:16px;height:16px;border:2.2px solid var(--ink);border-radius:5px 3px 6px 2px}
#tasks li.on{opacity:1;font-weight:bold}
#tasks li.on::before{background:var(--pinkL);animation:bob 1s infinite}
#tasks li.done{opacity:.85;text-decoration:line-through wavy rgba(58,42,34,.45)}
#tasks li.done::before{background:var(--sage)}
#tasks li.done::after{content:"✓";position:absolute;left:4px;top:-2px;font-size:20px;font-weight:bold}
.hintBox{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start;margin-top:6px}
.hintBox .speech{background:#fff9ec;border:2px solid var(--ink);border-radius:16px 6px 18px 6px/6px 18px 6px 16px;padding:8px 10px;font-size:18px;position:relative;min-height:70px}
.hintBox .speech::before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--ink)}
#meters{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.meter{font-size:16px}
.meter .bar{height:14px;border:2px solid var(--ink);border-radius:8px 4px 9px 3px/3px 9px 4px 8px;background:#fff9ec;overflow:hidden;position:relative}
.meter .bar i{position:absolute;inset:0 auto 0 0;background:var(--sage);width:0;transition:width .15s}
.meter .bar b{position:absolute;top:0;bottom:0;border-left:2px dashed var(--ink);opacity:.6}
.meter.warn .bar i{background:#e8a28f}
.sideBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* svg anims */
.spinCW{animation:spin 1.1s linear infinite}
.unscrew{animation:unscrew .6s forwards;transform-box:fill-box;transform-origin:center}
@keyframes unscrew{to{transform:rotate(-540deg) scale(.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.fb{transform-box:fill-box;transform-origin:center}
.foam{animation:foam 1.2s forwards;transform-box:fill-box;transform-origin:center}
@keyframes foam{0%{transform:scale(.3)}30%{transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
.bubble{animation:bub 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes bub{0%{transform:scale(.2);opacity:.9}100%{transform:translate(0,-30px) scale(1.4);opacity:0}}
.puff{animation:puff 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes puff{0%{opacity:.75;transform:scale(.4)}100%{opacity:0;transform:translate(-50px,-26px) scale(2.2)}}
.spark{animation:spark .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6) rotate(40deg);opacity:0}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.15);opacity:.55}}
.pointerHand{animation:tapme 1.1s ease-in-out infinite}
@keyframes tapme{50%{transform:translate(6px,10px)}}
.vibe{animation:vibe .09s linear infinite}
@keyframes vibe{50%{transform:translate(1px,-1px)}}
.blink{animation:blink .6s steps(2) infinite}
.blinkFast{animation:blink .25s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flick .4s infinite}
@keyframes flick{0%,100%{opacity:.25}30%{opacity:.6}50%{opacity:.1}70%{opacity:.45}}
.drop{animation:drop 1s ease-in forwards}
@keyframes drop{to{transform:translateY(60px);opacity:0}}
.bounceIn{animation:bounceIn .6s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes bounceIn{from{transform:scale(0)}}
.lbl{font-family:'Patrick Hand';font-size:18px;fill:var(--ink)}
.lblB{font-family:Gaegu;font-weight:700;font-size:22px;fill:var(--ink)}

/* ---------- RESULTS ---------- */
.result{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;padding:22px;align-items:center}
@media (max-width:760px){.result{grid-template-columns:1fr}}
.result h2{font-size:46px}
.bigStars{display:flex;gap:10px;margin:8px 0 12px}
.bigStars svg{width:90px;height:90px}
.bigStars .s{opacity:.25;transform:scale(.7);transition:all .45s cubic-bezier(.3,1.7,.5,1)}
.bigStars .s.on{opacity:1;transform:scale(1) rotate(-6deg)}
.rows{font-size:21px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.rows .mini{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff9ec;overflow:hidden}
.rows .mini i{display:block;height:100%;background:var(--sage)}
.coinsWon{font-family:Gaegu;font-weight:700;font-size:30px;margin-top:10px}
.unlocks{margin-top:8px;font-size:19px}

/* ---------- SHOP ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs .btn{font-size:19px;padding:4px 14px}
.tabs .btn.on{background:#f0d58a}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.item{padding:12px;display:flex;flex-direction:column;gap:6px}
.item .pv{height:110px;display:grid;place-items:center;background:#fbf4e4;border:2px dashed rgba(58,42,34,.35);border-radius:12px}
.item .pv svg{max-height:104px;max-width:100%}
.item h3{font-size:23px}
.item p{margin:0;font-size:16px;opacity:.8;flex:1}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{font-size:15px;border:2px solid var(--ink);border-radius:10px;padding:1px 8px;background:#d6e2b6}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ach .card{padding:12px 14px;display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center}
.ach .card.off{opacity:.55;filter:grayscale(.8)}
.ach .medal{width:54px;height:54px}
.ach h3{font-size:22px}.ach p{margin:0;font-size:16px}
.footnote{color:var(--cream);opacity:.85;text-align:center;margin-top:16px;font-size:16px;text-shadow:1px 1px 0 var(--ink)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <filter id="rough" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="11"/><feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.14  0 0 0 0 0.05  1.6 0 0 0 -0.55"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff7c8" stop-opacity=".95"/><stop offset=".5" stop-color="#ffe38a" stop-opacity=".45"/><stop offset="1" stop-color="#ffe38a" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowO"><stop offset="0" stop-color="#ffd27a" stop-opacity="1"/><stop offset="1" stop-color="#ff9c3a" stop-opacity="0"/></radialGradient>
  <radialGradient id="dentG"><stop offset="0" stop-color="#2a1d16" stop-opacity=".55"/><stop offset=".7" stop-color="#2a1d16" stop-opacity=".2"/><stop offset="1" stop-color="#2a1d16" stop-opacity="0"/></radialGradient>
  <linearGradient id="pearl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#f6d9ff" stop-opacity=".15"/><stop offset="1" stop-color="#cfe9ff" stop-opacity=".35"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 </defs>
</svg>
<div id="app">
 <div class="topbar">
  <div class="brand" id="brandBtn" style="cursor:pointer">✶ Vespa Fix-Up Garage</div>
  <div style="display:flex;gap:8px;align-items:center">
   <span class="pill" title="Coins"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#d9b24c" stroke="#3a2a22" stroke-width="2"/><path d="M12 6.5 L13.6 10.4 L17.6 10.6 L14.5 13.1 L15.6 17 L12 14.8 L8.4 17 L9.5 13.1 L6.4 10.6 L10.4 10.4Z" fill="#f4ecd9" stroke="#3a2a22" stroke-width="1.2"/></svg><b id="coinTxt">0</b></span>
   <button class="btn cream iconbtn" id="sndBtn" title="Sound on/off">🔊</button>
  </div>
 </div>

 <section id="scr-menu" class="screen">
  <div class="card hero" id="hero"></div>
  <p class="footnote">Tap, drag, hold and spin your way through five real repair jobs. Earn up to ★★★ on each by working accurately, quickly and with the right tools.</p>
 </section>

 <section id="scr-levels" class="screen">
  <div class="sectionHead"><h2>Repair Jobs</h2><div style="display:flex;gap:8px"><button class="btn sage" data-go="shop">Shop</button><button class="btn cream" data-go="ach">Achievements</button><button class="btn cream" data-go="menu">← Garage</button></div></div>
  <div class="levels" id="levelGrid"></div>
 </section>

 <section id="scr-shop" class="screen">
  <div class="sectionHead"><h2>Garage Shop</h2><button class="btn cream" data-go="levels">← Repair Jobs</button></div>
  <div class="tabs" id="shopTabs"></div>
  <div class="shop" id="shopGrid"></div>
 </section>

 <section id="scr-ach" class="screen">
  <div class="sectionHead"><h2>Achievements</h2><button class="btn cream" data-go="levels">← Repair Jobs</button></div>
  <div class="ach" id="achGrid"></div>
 </section>

 <section id="scr-play" class="screen">
  <div class="playwrap">
   <div id="stage">
    <svg id="bg" viewBox="0 0 960 600" preserveAspectRatio="none"></svg>
    <svg id="scene" viewBox="0 0 960 600"><g id="layer"></g></svg>
    <canvas id="cv" width="960" height="600"></canvas>
    <svg id="over" viewBox="0 0 960 600"><g id="overG"></g><g id="cursorG"></g></svg>
    <div id="actions"></div>
    <div id="tray"></div>
    <div id="toasts"></div>
    <div id="modal" hidden></div>
   </div>
   <aside id="side" class="card">
    <div class="hand" style="font-size:16px;opacity:.7" id="lvNum">Level 1</div>
    <h2 class="lvTitle" id="lvTitle">Flat Tire</h2>
    <div class="stats"><span class="pill">⏱ <b id="hudTime">0:00</b></span><span class="pill">✗ <b id="hudMist">0</b></span><span class="pill" title="Par time">par <b id="hudPar">1:20</b></span></div>
    <ol id="tasks"></ol>
    <div class="hintBox"><div id="mascotHead"></div><div class="speech" id="hintTxt">Let's go!</div></div>
    <div id="meters"></div>
    <div class="sideBtns"><button class="btn cream sm" id="helpBtn">? How to</button><button class="btn cream sm" id="restartBtn">↻ Restart</button><button class="btn cream sm" id="quitBtn">✕ Quit</button></div>
   </aside>
  </div>
 </section>

 <section id="scr-result" class="screen">
  <div class="card result" id="resultCard"></div>
 </section>
</div>
<script>
// ================= CORE =================
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NS='http://www.w3.org/2000/svg';
const INK='#3a2a22';

const Snd={ctx:null,on:true,loopNodes:null,
 init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})},
 tone(f,d=.12,type='sine',vol=.12,slide=0,delay=0){if(!this.on||!this.ctx)return;try{const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}catch(e){}},
 noise(d=.3,vol=.08,freq=1500,delay=0,q=.8){if(!this.on||!this.ctx)return;try{const c=this.ctx,t=c.currentTime+delay,len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),da=b.getChannelData(0);for(let i=0;i<len;i++)da[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t)}catch(e){}},
 click(){this.tone(900,.04,'square',.04)},
 ratchet(){for(let i=0;i<5;i++)this.tone(1400+i*40,.025,'square',.035,0,i*.06)},
 clank(){this.tone(210,.18,'triangle',.22,-90);this.noise(.12,.18,3200);this.tone(1600,.08,'sine',.05)},
 thud(){this.tone(120,.15,'sine',.2,-50);this.noise(.08,.08,500)},
 ding(){this.tone(880,.15,'sine',.1);this.tone(1320,.3,'sine',.08,0,.1)},
 buzz(){this.tone(130,.28,'sawtooth',.08,-30)},
 beep(){this.tone(1180,.16,'square',.05)},
 hiss(d=.18,v=.05){this.noise(d,v,4500,0,.6)},
 pop(){this.tone(500,.07,'sine',.1,400)},
 zap(){this.noise(.15,.15,6000,0,2);this.tone(60,.15,'sawtooth',.06)},
 squeak(){this.tone(1500,.06,'sine',.05,600)},
 horn(){this.tone(415,.45,'square',.06);this.tone(523,.45,'square',.05)},
 sputter(){for(let i=0;i<4;i++){this.tone(60+i*8,.07,'sawtooth',.1,-20,i*.11);this.noise(.06,.06,400,i*.11)}},
 star(i){this.tone([660,830,990][i]||660,.28,'triangle',.12);this.tone(([660,830,990][i]||660)*2,.2,'sine',.04,0,.05)},
 coin(){this.tone(1320,.08,'square',.04);this.tone(1760,.18,'square',.04,0,.07)},
 startLoop(kind){this.stopLoop();if(!this.on||!this.ctx)return;try{const c=this.ctx,o=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.value=kind==='engine'?48:120;f.type='lowpass';f.frequency.value=420;lfo.frequency.value=kind==='engine'?13:7;lg.gain.value=.06;g.gain.value=.07;lfo.connect(lg).connect(g.gain);o.connect(f).connect(g).connect(c.destination);o.start();lfo.start();this.loopNodes=[o,lfo,g]}catch(e){}},
 stopLoop(){if(this.loopNodes){try{this.loopNodes[2].gain.setValueAtTime(0,this.ctx.currentTime);this.loopNodes[0].stop();this.loopNodes[1].stop()}catch(e){}this.loopNodes=null}}
};

function pt(e){const r=$('#stage').getBoundingClientRect();return{x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*600/r.height}}
function dragOn(el,h){
 el.style.cursor='grab';
 el.addEventListener('pointerdown',e=>{
  if(!RUN)return;e.preventDefault();e.stopPropagation();Snd.init();
  const p=pt(e);if(h.down&&h.down(p,e)===false)return;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{h.move&&h.move(pt(ev),ev)};
  const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);h.up&&h.up(pt(ev),ev)};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 });
}

// ---------- surface (canvas grid for sanding / painting / filler) ----------
class Surface{
 constructor(pathStr,tf,bb,cell=6){
  this.cell=cell;const m=new DOMMatrix([tf.s,0,0,tf.s,tf.x,tf.y]);
  this.path=new Path2D();this.path.addPath(new Path2D(pathStr),m);
  this.x0=tf.x+bb[0]*tf.s;this.y0=tf.y+bb[1]*tf.s;
  this.w=Math.ceil((bb[2]-bb[0])*tf.s/cell);this.h=Math.ceil((bb[3]-bb[1])*tf.s/cell);
  const n=this.w*this.h;this.n=n;this.mask=new Uint8Array(n);this.count=0;
  const ctx=$('#cv').getContext('2d');ctx.setTransform(1,0,0,1,0,0);
  for(let j=0;j<this.h;j++)for(let i=0;i<this.w;i++){if(ctx.isPointInPath(this.path,this.x0+(i+.5)*cell,this.y0+(j+.5)*cell)){this.mask[j*this.w+i]=1;this.count++}}
  this.L={};this.noise=new Float32Array(n);for(let k=0;k<n;k++)this.noise[k]=Math.random();
  this.off=document.createElement('canvas');this.off.width=this.w;this.off.height=this.h;this.octx=this.off.getContext('2d');this.img=this.octx.createImageData(this.w,this.h);
 }
 layer(name,init=0){const a=new Float32Array(this.n);if(typeof init==='function'){for(let k=0;k<this.n;k++)a[k]=init(k)}else a.fill(init);this.L[name]=a;return a}
 cellXY(k){return{x:this.x0+((k%this.w)+.5)*this.cell,y:this.y0+(Math.floor(k/this.w)+.5)*this.cell}}
 inside(x,y){const i=Math.floor((x-this.x0)/this.cell),j=Math.floor((y-this.y0)/this.cell);if(i<0||j<0||i>=this.w||j>=this.h)return false;return !!this.mask[j*this.w+i]}
 each(x,y,r,fn){const c=this.cell,w=this.w;const i0=Math.max(0,Math.floor((x-r-this.x0)/c)),i1=Math.min(w-1,Math.floor((x+r-this.x0)/c)),j0=Math.max(0,Math.floor((y-r-this.y0)/c)),j1=Math.min(this.h-1,Math.floor((y+r-this.y0)/c));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const k=j*w+i;if(!this.mask[k])continue;const dx=this.x0+(i+.5)*c-x,dy=this.y0+(j+.5)*c-y,d2=dx*dx+dy*dy;if(d2>r*r)continue;fn(k,1-Math.sqrt(d2)/r)}}
 frac(fn){let n=0;for(let k=0;k<this.n;k++)if(this.mask[k]&&fn(k))n++;return n/this.count}
 render(colorFn){const d=this.img.data;for(let k=0;k<this.n;k++){const c=colorFn(k);d[k*4]=c[0];d[k*4+1]=c[1];d[k*4+2]=c[2];d[k*4+3]=255}
  this.octx.putImageData(this.img,0,0);const cv=$('#cv'),ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,960,600);ctx.save();ctx.clip(this.path);ctx.imageSmoothingEnabled=true;ctx.drawImage(this.off,this.x0,this.y0,this.w*this.cell,this.h*this.cell);ctx.restore()}
}

// ================= RUN FRAMEWORK =================
let RUN=null;
function makeC(run){
 const tok=run.tok,alive=()=>RUN&&RUN.tok===tok;
 const layer=()=>$('#layer'),overG=()=>$('#overG');
 const C={run,alive,
  wait(ms){return new Promise(r=>setTimeout(()=>{if(alive())r()},ms))},
  frame(fn){let last=performance.now();const loop=t=>{if(!alive())return;const dt=Math.min(.05,(t-last)/1000);last=t;if(run.paused){requestAnimationFrame(loop);return}if(fn(dt)!==false)requestAnimationFrame(loop)};requestAnimationFrame(loop)},
  clear(){layer().innerHTML='';overG().innerHTML='';const old=$('#cv'),n=old.cloneNode(false);n.style.display='none';old.replaceWith(n);
   C.tray([]);C.actions([]);C.cursor(null);$('#meters').innerHTML='';Snd.stopLoop();run.keys=[]},
  add(html,parent){const g=document.createElementNS(NS,'g');g.innerHTML=html;(parent||layer()).appendChild(g);return g},
  over(html){return C.add(html,overG())},
  canvas(){const c=$('#cv');c.style.display='block';return c},
  hint(html,mood){$('#hintTxt').innerHTML=html;if(mood)setMascot(mood)},
  toast(t,kind='good'){const d=document.createElement('div');d.className='toast '+kind;d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2300)},
  mistake(msg,tool){if(!alive())return;run.mist++;if(tool)run.toolErr++;Snd.buzz();C.toast('✗ '+msg,'bad');const st=$('#stage');st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake');updateHUD();setMascot('oops');clearTimeout(run.moodT);run.moodT=setTimeout(()=>setMascot('happy'),1500)},
  good(msg){Snd.ding();C.toast(msg,'good');setMascot('wow');clearTimeout(run.moodT);run.moodT=setTimeout(()=>setMascot('happy'),1200)},
  acc(v){run.acc.push(clamp(v,0,1))},
  cursor(id){const g=$('#cursorG');g.innerHTML=id?`<g transform="translate(-26,-30) scale(1.05)" filter="url(#rough)">${TOOLS[id].svg(handle())}</g>`:'';run.cursor=id},
  tray(items){const t=$('#tray');t.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.className='tool';b.innerHTML=toolIcon(it.id)+TOOLS[it.id].name;b.onclick=()=>{Snd.init();it.fn(b)};if(it.hint)b.classList.add('hintme');t.appendChild(b)})},
  actions(list){const a=$('#actions');a.innerHTML='';list.forEach(o=>C.btn(o.label,o.fn,o.cls))},
  btn(label,fn,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.innerHTML=label;b.onclick=()=>{Snd.init();Snd.click();fn(b)};$('#actions').appendChild(b);return b},
  hold(label,down,up,space){const b=document.createElement('button');b.className='btn hold gold';b.innerHTML=label;let on=false;
   const d=e=>{if(e)e.preventDefault();if(on)return;on=true;Snd.init();b.classList.add('on');down()};const u=()=>{if(!on)return;on=false;b.classList.remove('on');up&&up()};
   b.addEventListener('pointerdown',d);b.addEventListener('pointerup',u);b.addEventListener('pointerleave',u);b.addEventListener('pointercancel',u);
   if(space)C.key((e,type)=>{if(e.code==='Space'){e.preventDefault();type==='down'?(!e.repeat&&d()):u()}});
   $('#actions').appendChild(b);return b},
  key(fn){run.keys.push(fn)},
  pickTool(correct,opts,prompt){return new Promise(res=>{let done=false;C.hint(prompt||'Pick the right tool for the job.');
   const ids=shuffle([...new Set([correct,...opts])]);
   C.tray(ids.map(id=>({id,hint:run.tut&&id===correct,fn:b=>{if(done||!alive())return;if(id===correct){done=true;Snd.click();$$('.tool').forEach(x=>x.classList.remove('hintme'));b.classList.add('sel');run.tool=id;res(id)}else{C.mistake(`${TOOLS[id].name} isn't right here.`,true);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),400)}}})))})},
  choose(opts,prompt){return new Promise(res=>{if(prompt)C.hint(prompt);C.actions(opts.map(o=>({label:o.label,cls:o.cls||'cream',fn:()=>{C.actions([]);res(o.value)}})))})},
  drag(el,h){dragOn(el,h)},
  tap(el,fn){el.style.cursor='pointer';el.addEventListener('pointerdown',e=>{if(!alive()||run.paused)return;e.preventDefault();e.stopPropagation();Snd.init();fn(pt(e),e)})},
  tapOnce(el){return new Promise(res=>{let d=false;C.tap(el,p=>{if(!d){d=true;res(p)}})})},
  point(x,y){if(run.tut)return C.over(`<g transform="translate(${x},${y})">${handSVG}</g>`);return null},
  unpoint(g){if(g)g.remove()},
  meter(id,label,mark){const m=document.createElement('div');m.className='meter';m.id='m_'+id;m.innerHTML=`<div style="display:flex;justify-content:space-between"><span>${label}</span><b class="v">0%</b></div><div class="bar"><i></i>${mark?`<b style="left:${mark*100}%"></b>`:''}</div>`;$('#meters').appendChild(m)},
  setMeter(id,f,txt,warn){const m=$('#m_'+id);if(!m)return;m.querySelector('i').style.width=clamp(f,0,1)*100+'%';m.querySelector('.v').textContent=txt!==undefined?txt:Math.round(f*100)+'%';m.classList.toggle('warn',!!warn)},
  panel(x,y,w,h){return C.add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="${PAL.cream}" ${S(3)} filter="url(#rough)"/><rect x="${x+8}" y="${y+8}" width="${w-16}" height="${h-16}" rx="16" fill="none" stroke="${PAL.pink}" stroke-width="2" stroke-dasharray="6 6"/>`)},
  fx(html,ms=1400){const g=C.over(html);setTimeout(()=>g.remove(),ms);return g},
  puff(x,y,col='#e9e3d6'){C.fx(`<circle cx="${x}" cy="${y}" r="10" fill="${col}" ${S(1.5)} class="puff"/>`)},
  sparks(x,y){C.fx(`<g>${[0,1,2].map(i=>`<path d="${starPath(x+rnd(-14,14),y+rnd(-14,14),rnd(8,14),.3,4)}" fill="${PAL.gold}" class="spark"/>`).join('')}</g>`,600)},
  confetti(x,y){C.fx(`<g>${Array.from({length:10},()=>`<path d="${starPath(x+rnd(-60,60),y+rnd(-40,40),rnd(6,12),.42)}" fill="${pick([PAL.gold,PAL.pink,PAL.pinkL])}" class="spark"/>`).join('')}</g>`,700)}
 };
 return C;
}
document.addEventListener('keydown',e=>{if(RUN&&!RUN.paused)RUN.keys.forEach(f=>f(e,'down'))});
document.addEventListener('keyup',e=>{if(RUN&&!RUN.paused)RUN.keys.forEach(f=>f(e,'up'))});
document.addEventListener('pointermove',e=>{if(!RUN||!RUN.cursor)return;const p=pt(e);$('#cursorG').setAttribute('transform',`translate(${p.x},${p.y})`)},{passive:true});

// circular "unscrew" gesture: dir -1 = anticlockwise (loosen), +1 = clockwise (tighten)
function spinGesture(C,el,cx,cy,dir,turns,onAngle){return new Promise(res=>{let last=null,total=0,warned=false,done=false;
 C.drag(el,{down(p){if(done)return false;last=Math.atan2(p.y-cy,p.x-cx)},move(p){if(done||last===null)return;const a=Math.atan2(p.y-cy,p.x-cx);let d=a-last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;last=a;
  if(Math.sign(d)!==dir&&Math.abs(d)>.02){total-=Math.abs(d)*.3;if(total<-Math.PI&&!warned){warned=true;C.mistake(dir<0?'Lefty-loosey! Turn anticlockwise.':'Righty-tighty! Turn clockwise.')}}else total+=Math.abs(d);
  total=Math.max(total,-Math.PI*1.2);onAngle(total*dir);if(Math.random()<.12)Snd.squeak();
  if(total>=turns*Math.PI*2){done=true;res(warned)}},up(){last=null}})})}

// ================= LEVEL 1 — FLAT TIRE =================
function tyreClose(cx,cy,r,o={}){
 let s=`<g filter="url(#rough)">`;
 if(o.flat)s+=`<path d="M${cx-r},${cy} A${r},${r} 0 0 1 ${cx+r},${cy} L${cx+r*1.07},${cy+r*.8} Q${cx+r*.95},${cy+r} ${cx+r*.62},${cy+r} L${cx-r*.62},${cy+r} Q${cx-r*.95},${cy+r} ${cx-r*1.07},${cy+r*.8} Z" fill="${PAL.rubber}" ${S(3)}/>`;
 else s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PAL.rubber}" ${S(3)}/>`;
 for(let i=0;i<44;i++){const a=i*Math.PI*2/44;if(o.flat&&Math.sin(a)>.7)continue;s+=`<line x1="${(cx+Math.cos(a)*(r-7)).toFixed(1)}" y1="${(cy+Math.sin(a)*(r-7)).toFixed(1)}" x2="${(cx+Math.cos(a)*(r-22)).toFixed(1)}" y2="${(cy+Math.sin(a)*(r-22)).toFixed(1)}" stroke="#211915" stroke-width="5" stroke-linecap="round"/>`}
 s+=`<circle cx="${cx}" cy="${cy}" r="${r*.78}" fill="none" stroke="#6a5a50" stroke-width="2" stroke-dasharray="7 10"/>`;
 s+=`<circle cx="${cx}" cy="${cy}" r="${r*.6}" fill="${PAL.cream}" ${S(3)}/><circle cx="${cx}" cy="${cy}" r="${r*.5}" fill="none" stroke="${PAL.tan}" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="${r*.18}" fill="${PAL.metal}" ${S(2.5)}/><circle cx="${cx}" cy="${cy}" r="${r*.07}" fill="${PAL.greyD}"/>`;
 s+=`<path d="${starPath(cx-r*.38,cy+r*.24,10,.42)}" fill="${PAL.pink}" ${S(1.5)}/>`;

}
const nutP=(cx,cy,R,i)=>{const a=(-90+72*i)*Math.PI/180;return{x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R}};
const nutSVG=(x,y,r=15,loose)=>`<g class="fb"><polygon points="${hexPts(x,y,r)}" fill="${loose?'#e6e1d6':PAL.metal}" ${S(2.5)}/><circle cx="${x}" cy="${y}" r="${r*.42}" fill="${PAL.greyD}" ${S(1.5)}/></g>`;

const PAINT_T={x:170,y:56,s:1.55},PAINT_BB=[20,30,390,212];
function paintOverlay(tape){
 const T=PAINT_T;
 return `<g transform="translate(${T.x},${T.y}) scale(${T.s})" filter="url(#rough)"><path d="${VP.body}" fill="none" ${S(1.6)}/>
 <path d="M300,48 L262,37" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>${bar(262,37,248,34,6,PAL.brown)}
 <path d="${VP.seat}" fill="${PAL.brown}" ${S(1.6)}/><circle cx="352" cy="53" r="11" fill="${PAL.cream}" ${S(1.6)}/><rect x="20" y="150" width="11" height="17" rx="3" fill="#d9776a" ${S(1.4)}/>
 ${tape?`<g opacity=".92"><path d="M60,104 L202,100 L202,126 L60,128Z" fill="${PAL.denim}" ${S(1.2)}/><circle cx="352" cy="53" r="13" fill="${PAL.denim}" ${S(1.2)}/><rect x="16" y="146" width="19" height="25" fill="${PAL.denim}" ${S(1.2)}/></g>`:''}</g>`;
}
function setupPaint(C,R){
 const sf=R.psf;C.clear();C.add(`<g transform="translate(${PAINT_T.x},${PAINT_T.y}) scale(${PAINT_T.s})">${vespa({decals:false})}</g>`);
 const cv=C.canvas();C.over(paintOverlay(R.tape));
 const render=()=>sf.render(k=>paintColor(R,k));render();return{cv,render};
}
function paintColor(R,k){const sf=R.psf,L=sf.L;
 let c=R.oldFaded;if(L.scr[k])c=mix(c,[250,247,238],.65*(1-L.scuff[k]));
 c=mix(c,[214,208,198],L.scuff[k]*.55);
 if(L.pr[k]>0)c=mix(c,[192,188,184],Math.min(1,L.pr[k]));
 if(L.pa[k]>0)c=mix(c,R.newRGB,Math.min(1,L.pa[k]*1.05));
 if(L.cl[k]>0)c=mix(c,[255,255,255],Math.min(1,L.cl[k])*.06);
 if(L.gl[k]>0)c=mix(c,[255,255,255],Math.min(1,L.gl[k])*.12*(.4+sf.noise[k]*.2+((k%sf.w)/sf.w)*.5));
 if(L.dirt[k]>0)c=mix(c,[110,88,60],Math.min(1,L.dirt[k])*.85);
 return c}
function initPaint(R){
 const sf=new Surface(VP.body,PAINT_T,PAINT_BB,6);R.psf=sf;
 const blobs=Array.from({length:16},()=>({x:rnd(sf.x0,sf.x0+sf.w*6),y:rnd(sf.y0+40,sf.y0+sf.h*6),r:rnd(25,70)}));
 sf.layer('dirt',k=>{const p=sf.cellXY(k);let m=0;blobs.forEach(b=>{m=Math.max(m,1.3-Math.hypot(p.x-b.x,p.y-b.y)/b.r)});m+=(p.y-sf.y0)/(sf.h*6)*.5-.1;return clamp(m,0,1)+sf.noise[k]*.15});
 const lines=Array.from({length:12},()=>{const x=rnd(sf.x0,sf.x0+sf.w*6),y=rnd(sf.y0,sf.y0+sf.h*6),a=rnd(-.5,.5);return{x,y,dx:Math.cos(a),dy:Math.sin(a),len:rnd(40,110)}});
 sf.layer('scr',k=>{const p=sf.cellXY(k);for(const l of lines){const t=(p.x-l.x)*l.dx+(p.y-l.y)*l.dy;if(t<0||t>l.len)continue;const d=Math.abs((p.x-l.x)*l.dy-(p.y-l.y)*l.dx);if(d<4)return 1}return 0});
 ['scuff','pr','pa','cl','gl'].forEach(n=>sf.layer(n,0));
 R.oldFaded=mix(hex2rgb(COLORS[G.save.eq.color].hex),[226,220,206],.45);R.tape=false;
}
async function l5wash(C,R){
 initPaint(R);const {cv,render}=setupPaint(C,R);const sf=R.psf,d=sf.L.dirt;
 C.add(`<text x="480" y="508" text-anchor="middle" class="lblB" fill="${PAL.cream}">Faded, scratched & muddy. Let’s give her a new coat!</text>`);
 await C.pickTool('sponge',['sander','spraygun','polisher'],'Start by cleaning the body. Which tool?');
 C.cursor('sponge');C.hint('Scrub away all the <b>mud and grime</b>.');C.meter('clean','Clean',.95);
 await new Promise(res=>{let last=null,done=false;dragOn(cv,{down(p){last=p},move(p){if(done||!last)return;const mv=Math.min(30,dist(p,last));last=p;sf.each(p.x,p.y,34,(k,w)=>{d[k]=Math.max(0,d[k]-mv*.022*(.4+w))});if(Math.random()<.35)C.fx(`<circle cx="${p.x+rnd(-20,20)}" cy="${p.y+rnd(-20,20)}" r="${rnd(4,9)}" fill="#fff" opacity=".85" ${S(1)} class="foam"/>`,1200);render();
  const cl=sf.frac(k=>d[k]<.12);C.setMeter('clean',cl);if(cl>=.95){done=true;res()}},up(){last=null}})});
 for(let k=0;k<sf.n;k++)d[k]=0;C.cursor(null);
 for(let i=0;i<24;i++)C.fx(`<path d="M${rnd(250,750)},${rnd(110,300)} q-4,10 0,14 q4,-4 0,-14Z" fill="#9cc3e0" ${S(1)} class="drop"/>`,1000);Snd.hiss(.8,.06);render();
 C.acc(1);C.good('Sparkling clean!');await C.wait(900);
}
async function l5sand(C,R){
 const {cv,render}=setupPaint(C,R);const sf=R.psf,sc=sf.L.scuff;
 const t=await C.pickTool('p400',['p80','sponge','polisher'],'Scuff the old paint so new paint will stick. Which paper?');
 C.cursor('sander');C.hint('Sand the <b>whole body</b> until it’s evenly dull.');C.meter('sc','Scuffed',.93);
 await new Promise(res=>{let last=null,done=false;dragOn(cv,{down(p){last=p},move(p){if(done||!last)return;const mv=Math.min(30,dist(p,last));last=p;sf.each(p.x,p.y,34,(k,w)=>{sc[k]=Math.min(1,sc[k]+mv*.02*(.4+w))});if(Math.random()<.2)Snd.noise(.05,.03,2400);if(Math.random()<.25)C.fx(`<circle cx="${p.x+rnd(-20,20)}" cy="${p.y+rnd(-16,16)}" r="${rnd(3,6)}" fill="#efe5d0" class="puff"/>`,1000);render();
  const f=sf.frac(k=>sc[k]>.8);C.setMeter('sc',f);if(f>=.93){done=true;res()}},up(){last=null}})});
 C.cursor(null);C.acc(1);C.hint('Masking the seat, lights & tail-light…');R.tape=true;setupPaint(C,R);C.good('Prepped & masked!');await C.wait(900);
}
async function sprayCoat(C,R,layer,opts){
 const {cv,render}=setupPaint(C,R);const sf=R.psf,L=sf.L[layer];
 await C.pickTool('spraygun',['sponge','polisher','sander'],opts.prompt);
 C.cursor('spraygun');C.hint(opts.hint);
 const hv=hasUpg('hvlp'),rate=hv?2.6:3.2,sig=hv?24:20,drip=hv?2.35:2.05,lo=.75;
 C.meter('cov','Even coverage',.9);C.meter('runs','Runs / drips');C.meter('os','Overspray');
 let pos=null,runs=0,over=0,hissT=0,fin=false;const dripped=new Uint8Array(sf.n);
 dragOn(cv,{down(p){pos=p},move(p){pos=p},up(){pos=null}});
 const stat=()=>sf.frac(k=>L[k]>=lo&&L[k]<drip);
 C.frame(dt=>{if(fin)return false;if(!pos)return;const now=performance.now();if(now>hissT){hissT=now+140;Snd.hiss(.16,.035)}
  if(!sf.inside(pos.x,pos.y))over+=dt;
  sf.each(pos.x,pos.y,sig*2.4,(k,w)=>{const dd=(1-w)*sig*2.4;L[k]+=rate*dt*Math.exp(-dd*dd/(2*sig*sig));
   if(L[k]>drip&&!dripped[k]){runs++;const c=sf.cellXY(k);sf.each(c.x,c.y,26,kk=>dripped[kk]=1);const col=opts.dripCol||`rgb(${R.newRGB.join(',')})`;C.over(`<path d="M${c.x-5},${c.y} L${c.x+5},${c.y} L${c.x+3},${c.y+18} Q${c.x},${c.y+28} ${c.x-3},${c.y+18}Z" fill="${col}" ${S(1.2)} opacity=".9"/>`);C.toast('A run! Keep the gun moving.','bad');Snd.buzz()}});
  for(let i=0;i<2;i++)C.fx(`<circle cx="${pos.x+rnd(-sig*1.6,sig*1.6)}" cy="${pos.y+rnd(-sig*1.6,sig*1.6)}" r="${rnd(1.5,3.5)}" fill="${opts.mist}" opacity=".7" class="foam"/>`,500);
  render();C.setMeter('cov',stat());C.setMeter('runs',runs/6,String(runs),runs>0);C.setMeter('os',over/3,over.toFixed(1)+'s',over>1)});
 await new Promise(res=>{C.btn('✓ Done spraying',()=>{const cv2=stat();if(cv2<.75){C.toast(`Only ${Math.round(cv2*100)}% covered — keep going`,'meh');return}
  if(cv2<.9)C.mistake('Thin, patchy areas left behind.');if(runs>=3)C.mistake('Too many runs in the finish.');
  const a=clamp(cv2-runs*.04-over*.04,0,1);C.acc(a);R.paintQ.push(a);fin=true;res()},'sage')});
 C.cursor(null);await C.wait(300);
}

 {id:'collector',name:'Tool Collector',desc:'Own every tool upgrade.'},
 {id:'rainbow',name:'Rainbow Garage',desc:'Own 7 paint colours.'},
 {id:'rich',name:'Piggy Bank',desc:'Hold 500 coins at once.'}
];
function show(name){$$('.screen').forEach(s=>s.classList.toggle('on',s.id==='scr-'+name));window.scrollTo({top:0});
 if(name==='menu')drawMenu();if(name==='levels')drawLevels();if(name==='shop')drawShop();if(name==='ach')drawAch();updateCoins()}
function updateCoins(){$('#coinTxt').textContent=G.save.coins}
function starsStr(n){return [0,1,2].map(i=>`<span class="star ${i<n?'on':''}">★</span>`).join('')}
function drawMenu(){
 $('#hero').innerHTML=`<svg viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice"><g>${bgSVG()}</g>
  <g transform="translate(270,262) scale(1.02)">${vespa({})}</g>
  <g transform="translate(150,198) scale(1)">${mascot('happy')}</g>
  <g transform="translate(26,398) scale(.72)">${cow()}</g>
  <path d="${starPath(880,70,16)}" fill="${PAL.gold}" ${S(2)}/><path d="${starPath(720,120,9)}" fill="${PAL.pinkL}" ${S(1.5)}/></svg>
  <div class="title-wrap"><h1>Vespa<br>Fix-Up Garage</h1><p>Five repairs. Fifteen stars. One very cute scooter.</p></div>
  <div class="menuBtns"><button class="btn gold" id="playBtn">▶ Repair Jobs</button><button class="btn sage" data-go="shop">Shop</button><button class="btn cream" data-go="ach">Achievements</button></div>`;
 $('#playBtn').onclick=()=>{Snd.init();Snd.click();show('levels')};bindGo($('#hero'));
}
function lvlIcon(l){const ic={wheel:`<g transform="translate(100,60) scale(.3)">${tyreClose(0,0,170)}</g>`,engine:`<g transform="translate(20,0) scale(.82)">${engineMini()}</g><g transform="translate(130,30)">${TOOLS.plugsocket.svg(handle())}</g>`,bolt:`<g transform="translate(30,30) scale(.25)">${batterySVG(0,0)}</g><path d="M140,20 L118,64 L136,64 L124,104 L160,52 L142,52 L156,20Z" fill="${PAL.gold}" ${S(2.4)}/>`,hammer:`<g transform="translate(20,-20) scale(.6)"><path d="${VP.cowl}" fill="${COLORS[G.save.eq.color].hex}" ${S(3)}/><ellipse cx="110" cy="166" rx="18" ry="12" fill="url(#dentG)"/></g><g transform="translate(120,20) scale(1.2)">${TOOLS.dolly.svg(handle())}</g>`,spray:`<g transform="translate(110,18) scale(1.3)">${TOOLS.spraygun.svg(handle())}</g>${Object.values(COLORS).slice(0,6).map((c,i)=>`<circle cx="${30+(i%3)*28}" cy="${40+Math.floor(i/3)*30}" r="13" fill="${c.hex}" ${S(2)}/>`).join('')}`}[l.icon];
 return `<svg class="ic" viewBox="0 0 200 120"><path d="${starPath(100,60,58,.5)}" fill="${PAL.pinkL}" opacity=".6"/><g filter="url(#rough)">${ic}</g></svg>`}
function drawLevels(){const g=$('#levelGrid');g.innerHTML='';
 LEVELS.forEach(l=>{const locked=l.id>G.save.unlocked,best=G.save.best[l.id];const d=document.createElement('div');d.className='card lvl'+(locked?' locked':'');
  d.innerHTML=`<div class="num">${l.id}</div>${lvlIcon(l)}<h3>${l.name}</h3><p>${l.sub}</p><div style="display:flex;justify-content:space-between;align-items:center"><span class="stars">${starsStr(best?best.stars:0)}</span><span style="font-size:15px;opacity:.75">${best?'best '+fmtT(best.time):'par '+fmtT(l.par)}</span></div>${best?`<div style="font-size:15px;margin-top:4px;opacity:.75">${l.steps.length} tasks · tap to replay</div>`:`<div style="font-size:15px;margin-top:4px;opacity:.75">${l.steps.length} tasks</div>`}`;
  if(!locked)d.onclick=()=>{Snd.init();Snd.click();startLevel(l.id)};g.appendChild(d)})}
let shopTab='Tools';
function drawShop(){const cats=[...new Set(SHOP.map(s=>s.cat))];const done5=!!G.save.best[5];
 $('#shopTabs').innerHTML=cats.map(c=>`<button class="btn cream ${c===shopTab?'on':''}" data-tab="${c}">${c}</button>`).join('');
 $$('#shopTabs .btn').forEach(b=>b.onclick=()=>{shopTab=b.dataset.tab;Snd.click();drawShop()});
 const grid=$('#shopGrid');grid.innerHTML='';
 SHOP.filter(s=>s.cat===shopTab).forEach(it=>{const own=owns(it.id),locked=it.needs5&&!done5&&!own;const eqd=it.eq&&G.save.eq[it.eq[0]]===it.eq[1];
  const d=document.createElement('div');d.className='card item';
  d.innerHTML=`<div class="pv">${it.pv()}</div><h3>${it.name}</h3><p>${it.desc}${locked?'<br><b>🔒 Finish “Fresh Paint” to unlock.</b>':''}</p><div class="row"><span>${own?'<span class="tag">Owned</span>':`<b>${it.price}</b> coins`}</span><span class="act"></span></div>`;
  const act=d.querySelector('.act');
  if(!own&&!locked){const b=document.createElement('button');b.className='btn gold sm';b.textContent='Buy';b.disabled=G.save.coins<it.price;b.onclick=()=>{if(G.save.coins<it.price)return;G.save.coins-=it.price;G.save.owned[it.id]=1;if(it.eq)G.save.eq[it.eq[0]]=it.eq[1];Snd.coin();persist();checkAch();drawShop();updateCoins()};act.appendChild(b)}
  else if(own&&it.eq){const b=document.createElement('button');b.className='btn sm '+(eqd?'sage':'cream');b.textContent=eqd?(it.cat==='Paint'?'On your Vespa':'Equipped'):(it.cat==='Paint'?'Respray':'Equip');b.disabled=eqd;b.onclick=()=>{G.save.eq[it.eq[0]]=it.eq[1];Snd.click();persist();drawShop()};act.appendChild(b)}
  grid.appendChild(d)});
 if(shopTab==='Vespas'){const d=document.createElement('div');d.className='card item';const on=G.save.eq.decals;d.innerHTML=`<div class="pv"><svg viewBox="0 0 120 80" width="120"><path d="${starPath(40,40,26,.42)}" fill="${PAL.pink}" ${S(2.4)}/><path d="${starPath(86,30,14,.42)}" fill="${PAL.pink}" ${S(2)}/></svg></div><h3>Star Decals</h3><p>Dusty-pink star stickers on the bodywork. Free!</p><div class="row"><span class="tag">Owned</span><button class="btn sm ${on?'sage':'cream'}">${on?'On':'Off'}</button></div>`;d.querySelector('button').onclick=()=>{G.save.eq.decals=!G.save.eq.decals;persist();drawShop()};grid.appendChild(d)}
}
function medal(on){return `<svg class="medal" viewBox="0 0 60 60"><path d="M18,2 L26,22 L34,22 L42,2" fill="${PAL.pink}" ${S(2)}/><circle cx="30" cy="36" r="20" fill="${on?PAL.gold:'#cbbf9f'}" ${S(2.4)}/><path d="${starPath(30,36,11,.45)}" fill="${PAL.cream}" ${S(1.6)}/></svg>`}
function drawAch(){$('#achGrid').innerHTML=ACH.map(a=>`<div class="card ${G.save.ach[a.id]?'':'off'}">${medal(G.save.ach[a.id])}<div><h3>${a.name}</h3><p>${a.desc}</p></div></div>`).join('')}
function unlockAch(id,list){if(!G.save.ach[id]){G.save.ach[id]=1;list&&list.push(ACH.find(a=>a.id===id).name)}}
function checkAch(res,list=[]){const s=G.save;
 if(res){unlockAch('first',list);if(res.mist===0)unlockAch('flawless',list);if(res.time<res.par*.6)unlockAch('speed',list);if(res.stars===3)unlockAch('three',list);if(res.accuracy>=.97)unlockAch('precise',list)}
 if(LEVELS.every(l=>s.best[l.id]))unlockAch('allclear',list);if(LEVELS.every(l=>s.best[l.id]&&s.best[l.id].stars===3))unlockAch('perfect',list);
 if(['pump','gloves','meter','sander','hvlp'].every(hasUpg))unlockAch('collector',list);if(Object.keys(COLORS).filter(c=>owns('color_'+c)).length>=7)unlockAch('rainbow',list);if(s.coins>=500)unlockAch('rich',list);
 persist();return list}
function bindGo(root){(root||document).querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{Snd.init();Snd.click();if(RUN)abortRun();show(b.dataset.go)})}

// ---------- level flow ----------
function updateHUD(){if(!RUN)return;$('#hudTime').textContent=fmtT(RUN.elapsed);$('#hudMist').textContent=RUN.mist;$('#hudTime').style.color=RUN.elapsed>RUN.def.par?'#a8432f':''}
setInterval(()=>{if(RUN&&!RUN.paused&&!RUN.finished){RUN.elapsed+=.25;updateHUD()}},250);
function abortRun(){if(RUN){RUN.tok=null;RUN=null}Snd.stopLoop();$('#modal').hidden=true;$('#cursorG').innerHTML=''}
function setTask(i,cls){const li=$$('#tasks li')[i];if(!li)return;li.className=cls}
function tutorial(def,first){return new Promise(res=>{const m=$('#modal');let i=0;RUN.paused=true;
 const draw=()=>{m.innerHTML=`<div class="card"><svg viewBox="10 20 140 310" width="100%">${mascot(i===def.tut.length-1?'wow':'happy')}</svg><div><h3>${first?'Job '+def.id+': '+def.name:'How to: '+def.name}</h3><div class="dots">${def.tut.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div><div class="txt">${def.tut[i]}</div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">${i>0?'<button class="btn cream sm" id="tPrev">Back</button>':''}<button class="btn gold" id="tNext">${i<def.tut.length-1?'Next →':"Let's fix it!"}</button></div></div></div>`;
  $('#tNext').onclick=()=>{Snd.click();if(i<def.tut.length-1){i++;draw()}else{m.hidden=true;if(RUN)RUN.paused=false;res()}};const p=$('#tPrev');if(p)p.onclick=()=>{i--;draw()}};
 m.hidden=false;draw()})}
async function startLevel(n,opt={}){
 abortRun();const def=LEVELS[n-1];
 RUN={n,def,tok:{},mist:0,toolErr:0,acc:[],elapsed:0,paused:false,keys:[],tut:!G.save.tut[n],finished:false};
 const C=makeC(RUN);show('play');$('#bg').innerHTML=bgSVG();C.clear();setMascot('happy');
 $('#lvNum').textContent='Job '+n+' of 5';$('#lvTitle').textContent=def.name;$('#hudPar').textContent=fmtT(def.par);updateHUD();
 $('#tasks').innerHTML=def.tasks.map(t=>`<li>${t}</li>`).join('');
 def.setup(RUN);
 if(RUN.tut)await tutorial(def,true);
 if(!C.alive())return;
 for(let i=opt.from||0;i<def.steps.length;i++){for(let j=0;j<i;j++)setTask(j,'done');setTask(i,'on');await def.steps[i](C,RUN);if(!C.alive())return;setTask(i,'done');Snd.ding();await C.wait(350)}
 finishLevel(C);
}
function finishLevel(C){
 const R=RUN;R.finished=true;const def=R.def;Snd.stopLoop();
 const accuracy=R.acc.length?R.acc.reduce((a,b)=>a+b,0)/R.acc.length:1;
 const t=R.elapsed,timeScore=t<=def.par?1:clamp(1-(t-def.par)/(def.par*1.2),0,1),mistScore=clamp(1-R.mist*.12,0,1);
 const total=accuracy*.42+timeScore*.28+mistScore*.3;
 const stars=(total>=.86&&R.mist<=2)?3:total>=.62?2:1;
 const prev=G.save.best[def.id];const first=!prev;
 let coins=stars*25+def.id*5+(R.mist===0?15:0)+(t<def.par*.6?10:0);if(!first&&prev.stars>=stars)coins=Math.round(coins*.5);
 G.save.coins+=coins;
 if(!prev||stars>prev.stars||(stars===prev.stars&&t<prev.time))G.save.best[def.id]={stars:Math.max(stars,prev?prev.stars:0),time:prev?Math.min(prev.time,t):t};
 G.save.unlocked=Math.max(G.save.unlocked,Math.min(5,def.id+1));G.save.tut[def.id]=1;G.save.plays++;
 const unlocks=[];
 if(def.id===5){const gift=['butter','mint','coral'].slice(0,stars);gift.forEach(c=>{if(!owns('color_'+c)){G.save.owned['color_'+c]=1;unlocks.push(COLORS[c].name+' paint')}});if(first)unlocks.push('Paint & finish shop');}
 const res={stars,time:t,par:def.par,mist:R.mist,accuracy};
 const achs=checkAch(res);persist();
 RUN=null;showResult(def,res,coins,unlocks,achs,R);
}
function showResult(def,res,coins,unlocks,achs,R){
 show('result');const bigStar=`<svg viewBox="0 0 100 100"><path d="${starPath(50,52,46,.45)}" fill="${PAL.gold}" ${S(4)} filter="url(#rough)"/></svg>`;
 const tScore=res.time<=res.par?1:clamp(1-(res.time-res.par)/(res.par*1.2),0,1);
 const msg=res.stars===3?'Perfect repair!':res.stars===2?'Nicely done!':'Fixed — but a bit rough.';
 $('#resultCard').innerHTML=`<div><svg viewBox="0 0 460 340" width="100%"><g transform="translate(30,40) scale(.92)">${vespa({})}</g><g transform="translate(320,130) scale(.75)">${cow()}</g></svg></div>
 <div><div class="hand" style="opacity:.7">Job ${def.id} · ${def.name}</div><h2>${msg}</h2>
 <div class="bigStars">${[0,1,2].map(i=>`<span class="s" id="bs${i}">${bigStar}</span>`).join('')}</div>
 <div class="rows">
  <span>⏱ Time</span><div class="mini"><i style="width:${tScore*100}%"></i></div><b>${fmtT(res.time)} <small>/ par ${fmtT(res.par)}</small></b>
  <span>🎯 Accuracy</span><div class="mini"><i style="width:${res.accuracy*100}%"></i></div><b>${Math.round(res.accuracy*100)}%</b>
  <span>✗ Mistakes</span><div class="mini"><i style="width:${clamp(1-res.mist*.12,0,1)*100}%"></i></div><b>${res.mist}</b>
  <span>🔧 Tool use</span><div class="mini"><i style="width:${clamp(1-R.toolErr*.2,0,1)*100}%"></i></div><b>${R.toolErr?R.toolErr+' wrong pick'+(R.toolErr>1?'s':''):'spot on'}</b>
 </div>
 <div class="coinsWon">+${coins} coins</div>
 ${unlocks.length?`<div class="unlocks">✶ Unlocked: <b>${unlocks.join(', ')}</b></div>`:''}
 ${achs.length?`<div class="unlocks">🏅 Achievement${achs.length>1?'s':''}: <b>${achs.join(', ')}</b></div>`:''}
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn cream" id="rRe">↻ Replay</button>${def.id<5?'<button class="btn gold" id="rNext">Next job →</button>':''}<button class="btn sage" data-go="levels">All jobs</button><button class="btn cream" data-go="shop">Shop</button></div></div>`;
 bindGo($('#resultCard'));$('#rRe').onclick=()=>{Snd.click();startLevel(def.id)};const nx=$('#rNext');if(nx)nx.onclick=()=>{Snd.click();startLevel(def.id+1)};
 for(let i=0;i<res.stars;i++)setTimeout(()=>{$('#bs'+i)?.classList.add('on');Snd.star(i)},400+i*450);
 setTimeout(()=>Snd.coin(),400+res.stars*450);
}

// ---------- init ----------
loadSave();Snd.on=G.save.sound!==false;
$('#sndBtn').textContent=Snd.on?'🔊':'🔈';
$('#sndBtn').onclick=()=>{Snd.on=!Snd.on;G.save.sound=Snd.on;persist();$('#sndBtn').textContent=Snd.on?'🔊':'🔈';if(!Snd.on)Snd.stopLoop();Snd.init();Snd.click()};
$('#brandBtn').onclick=()=>{abortRun();show('menu')};
$('#quitBtn').onclick=()=>{abortRun();show('levels')};
$('#restartBtn').onclick=()=>{if(RUN){const n=RUN.n;startLevel(n)}};
$('#helpBtn').onclick=()=>{if(RUN&&!RUN.paused)tutorial(RUN.def,false)};
bindGo();
const hashMap={jobs:'levels',shop:'shop',achievements:'ach'};
show(hashMap[location.hash.slice(1)]||'menu');
</script>
</body></html>
